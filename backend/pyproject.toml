[project]
name = "pcbai-backend"
version = "0.1.0"
description = "Backend API, design services, KiCad integration and AI orchestration for the PCB AI platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.143,<0.144",
  "uvicorn[standard]>=0.54,<0.55",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.20,<1.21",
  "psycopg[binary]>=3.3,<3.4",
  "pydantic>=2.14,<2.15",
  "pydantic-settings>=2.15,<2.16",
  "celery[redis]>=5.6,<5.7",
  "redis>=5,<9",
  "anthropic>=1.13,<2",
  "python-multipart>=0.0.20",
  # Transitive (TLS CA bundle); pinned to a release without known advisories (PYSEC-2026-4320).
  "certifi>=2026.10.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "httpx>=0.28,<0.29",
  "ruff>=0.17,<0.18",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.kicad" = ["scripts/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "kicad: requires a working KiCad installation (skipped automatically when unavailable)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007"]
